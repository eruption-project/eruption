on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

name: Continuous integration
jobs:
  preflight:
    name: Preflight (docs + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs consistency
        run: bash support/tests/check-docs.sh
      - name: i18n consistency
        run: bash support/tests/check-i18n.sh

  clippy_check:
    name: Static Analysis (clippy)
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Setup Dependencies
        run: "sudo apt-get update -y -qq; sudo apt-get install -y -qq build-essential cmake protobuf-compiler libprotobuf-dev \
  libsystemd-dev libusb-1.0-0-dev libhidapi-dev \
  libevdev-dev libudev-dev libdbus-1-dev libpulse-dev liblua5.4-dev libx11-dev \
  libxrandr-dev libgtk-3-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
  libpango1.0-dev libcairo2-dev libgtksourceview-4-dev"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets

  workspace_build:
    name: Workspace Build
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - nightly
    steps:
      - name: Setup Dependencies
        run: "sudo apt-get update -y -qq; sudo apt-get install -y -qq build-essential cmake protobuf-compiler libprotobuf-dev \
  libsystemd-dev libusb-1.0-0-dev libhidapi-dev \
  libevdev-dev libudev-dev libdbus-1-dev libpulse-dev liblua5.4-dev libx11-dev \
  libxrandr-dev libgtk-3-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
  libpango1.0-dev libcairo2-dev libgtksourceview-4-dev"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cargo check (all targets)
        run: cargo check --workspace --all-targets
      - name: Cargo build
        run: cargo build --workspace
      - name: Pyroclasm smoke tests (headless)
        if: matrix.rust == 'stable'
        run: cargo test -p pyroclasm --tests
